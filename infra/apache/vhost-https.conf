<VirtualHost 127.0.0.1:443 _default_:443>
  ServerName dralandaburo.com
  ServerAlias www.dralandaburo.com

  SSLEngine on
  SSLCertificateFile "/opt/bitnami/apache/conf/dralandaburo.com.crt"
  SSLCertificateKeyFile "/opt/bitnami/apache/conf/dralandaburo.com.key"

  # Support domain renewal when using mod_proxy
  <IfModule mod_proxy.c>
    ProxyPass /.well-known !
  </IfModule>
  Include "/opt/bitnami/apps/letsencrypt/conf/httpd-prefix.conf"

  # Proxy pass to Next.js on port 3000
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"

  ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=60 keepalive=On
  ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
